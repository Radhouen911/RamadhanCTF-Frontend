name: Deploy Frontend Theme

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: frontend-deploy-main
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Required GitHub Secrets:
#   EC2_HOST       — manager public IP
#   EC2_USER       — ubuntu
#   EC2_PORT       — 22
#   EC2_SSH_KEY    — private key content (the .pem file)
#
# The frontend repo IS the theme. We pull it directly into the theme dir
# (/opt/CTFd/CTFd/themes/Ramadhan), build in place, then restart CTFd.
# No temp dir or rsync needed.
# ---------------------------------------------------------------------------

jobs:
  deploy:
    name: Build and deploy Ramadhan theme
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Configure SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf "%s\n" "$EC2_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Add EC2 to known_hosts
        run: |
          ssh-keyscan -p "${{ secrets.EC2_PORT || '22' }}" -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull, build and restart on manager
        run: |
          ssh -p "${{ secrets.EC2_PORT || '22' }}" \
              "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "sudo bash -s" << 'REMOTE'
          set -euo pipefail

          THEME_DIR="/opt/CTFd/CTFd/themes/Ramadhan"
          CTFD_DIR="/opt/CTFd"
          FRONTEND_REPO="git@github.com:Radhouen911/RamadhanCTF-Frontend.git"
          export GIT_SSH_COMMAND="ssh -i /root/.ssh/ramadhan_frontend_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no"

          # First run: theme dir may not be a git repo (setup.sh used rsync)
          if [[ ! -d "${THEME_DIR}/.git" ]]; then
            echo "[*] First deploy — cloning frontend repo into ${THEME_DIR} ..."
            rm -rf "${THEME_DIR}"
            git clone "${FRONTEND_REPO}" "${THEME_DIR}"
          fi

          echo "[*] Syncing latest code (discarding local drift) ..."
          cd "${THEME_DIR}"
          git fetch origin main
          git reset --hard origin/main
          git clean -fd

          echo "[*] Installing dependencies ..."
          npm ci --silent

          echo "[*] Building theme ..."
          npm run build

          echo "[*] Restarting CTFd ..."
          cd "${CTFD_DIR}"
          docker compose restart ctfd

          echo "[✓] Deploy complete"
          REMOTE

      - name: Done
        run: echo "✅ Ramadhan theme deployed and CTFd restarted"
